<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ITPMD Project Hub</title>
<meta name="description" content="Functional MVP prototype of the ITPMD Project Hub">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#F7F4F4; --panel:#FFFFFF; --panel2:#FBF9F9; --ink:#211A1A; --ink2:#3A2F2F; --muted:#6B6060; --faint:#968B8B; --line:#E8E1E1; --line2:#F1ECEC;
  --accent:#B11116; --accent-ink:#FFFFFF; --accent-soft:#FBEBEB; --accent-2:#8E0D11; --ring:rgba(177,17,22,.28); --brand:#C79A3B;
  --gold:#B89040; --gold-ink:#6E5316; --gold-soft:#F8F1DE;
  --side:#4A0A0D; --side-2:#6A1015; --side-ink:#F1D9DA; --side-mute:#C99A9C; --side-on:#FFFFFF;
  --ok:#17803F; --ok-soft:#E4F4EA; --warn:#A96A00; --warn-soft:#FDF1D6; --bad:#B8321F; --bad-soft:#FCE8E4; --info:#2B5C99; --info-soft:#E7EEF8;
  --shadow-sm:0 1px 2px rgba(33,26,26,.05); --shadow:0 1px 2px rgba(33,26,26,.04),0 8px 24px rgba(33,26,26,.06);
  --r:10px; --r-sm:7px;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#130C0C; --panel:#1D1414; --panel2:#231818; --ink:#F1E8E8; --ink2:#D8CACA; --muted:#AE9E9E; --faint:#7E6F6F; --line:#3A2A2A; --line2:#2A1D1D;
  --accent:#E04A4F; --accent-ink:#1A0506; --accent-soft:#3A1416; --accent-2:#F08A8D; --ring:rgba(224,74,79,.32); --brand:#D9AE55;
  --gold:#D9AE55; --gold-ink:#EBCB86; --gold-soft:#33280F;
  --side:#2A0608; --side-2:#3B0B0E; --side-ink:#EBCFD0; --side-mute:#B78A8C; --side-on:#FFFFFF;
  --ok:#4CC27E; --ok-soft:#133322; --warn:#E2AA3E; --warn-soft:#33280F; --bad:#EE7A64; --bad-soft:#3A1C17; --info:#88AEE6; --info-soft:#1A2637;
  --shadow-sm:0 1px 2px rgba(0,0,0,.35); --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.3);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#130C0C; --panel:#1D1414; --panel2:#231818; --ink:#F1E8E8; --ink2:#D8CACA; --muted:#AE9E9E; --faint:#7E6F6F; --line:#3A2A2A; --line2:#2A1D1D;
  --accent:#E04A4F; --accent-ink:#1A0506; --accent-soft:#3A1416; --accent-2:#F08A8D; --ring:rgba(224,74,79,.32); --brand:#D9AE55;
  --gold:#D9AE55; --gold-ink:#EBCB86; --gold-soft:#33280F;
  --side:#2A0608; --side-2:#3B0B0E; --side-ink:#EBCFD0; --side-mute:#B78A8C; --side-on:#FFFFFF;
  --ok:#4CC27E; --ok-soft:#133322; --warn:#E2AA3E; --warn-soft:#33280F; --bad:#EE7A64; --bad-soft:#3A1C17; --info:#88AEE6; --info-soft:#1A2637;
  --shadow-sm:0 1px 2px rgba(0,0,0,.35); --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:13.5px;line-height:1.5;margin:0;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;text-wrap:balance;letter-spacing:-.005em;color:var(--ink)}
.mono{font-family:var(--mono);font-size:.9em}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .faint{color:var(--faint)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{height:100%}

/* ---------- app frame ---------- */
.frame{height:100%;display:grid;grid-template-columns:236px 1fr;min-height:0}
.side{background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;min-height:0}
.logo-slot{padding:16px 14px 14px;border-bottom:1px solid rgba(255,255,255,.07);display:flex;flex-direction:column;gap:10px}
.logo-card{background:#FFFFFF;border-radius:8px;padding:10px 12px;display:flex;align-items:center;justify-content:center;min-height:56px}
.logo-card img{max-height:30px;max-width:100%;object-fit:contain;display:block}
.product{display:flex;align-items:center;gap:10px}
.product .mk{width:34px;height:34px;border-radius:8px;background:var(--brand);color:#2A0608;display:grid;place-items:center;font-weight:700;font-size:13px;letter-spacing:.02em;flex:none}
.product b{display:block;color:var(--side-on);font-weight:600;font-size:14px;line-height:1.2}
.product small{display:block;color:var(--side-mute);font-size:11px;letter-spacing:.02em}
.logo-actions{display:flex;gap:10px;font-size:11.5px}
.logo-actions label,.logo-actions button{color:var(--side-mute);cursor:pointer;background:none;border:0;padding:0;text-decoration:underline;text-underline-offset:2px}
.logo-actions label:hover,.logo-actions button:hover{color:var(--side-on)}
.nav{padding:10px 10px;display:flex;flex-direction:column;gap:2px;overflow:auto;flex:1}
.nav .sect{font-size:10.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--side-mute);padding:14px 10px 6px}
.nav button{position:relative;display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:9px 12px;border:0;background:none;border-radius:7px;cursor:pointer;color:var(--side-ink);font-weight:500}
.nav button:hover{background:rgba(255,255,255,.06);color:var(--side-on)}
.nav button.on{background:var(--side-2);color:var(--side-on);font-weight:600}
.nav button.on::before{content:"";position:absolute;left:-10px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--brand)}
.nav svg{width:18px;height:18px;flex:none;opacity:.9}
.nav .badge{margin-left:auto;background:var(--brand);color:#2A0608;font-size:11px;font-weight:700;border-radius:10px;padding:0 7px;line-height:18px}
.side-foot{padding:12px 14px 16px;border-top:1px solid rgba(255,255,255,.07);font-size:11.5px;color:var(--side-mute);display:flex;flex-direction:column;gap:8px}
.side-foot b{color:var(--side-ink);font-weight:600}
.side-foot button{background:none;border:1px solid rgba(255,255,255,.14);color:var(--side-ink);border-radius:6px;padding:6px 10px;cursor:pointer;font-size:12px;text-align:left}
.side-foot button:hover{border-color:rgba(255,255,255,.3)}
.proto{display:inline-block;align-self:flex-start;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--brand);border:1px solid color-mix(in srgb,var(--brand) 45%,transparent);padding:2px 7px;border-radius:4px}

.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{height:58px;flex:none;display:flex;align-items:center;gap:14px;padding:0 20px;background:var(--panel);border-bottom:1px solid var(--line)}
.crumb{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb b{color:var(--ink);font-weight:600}
.crumb .sep{color:var(--faint)}
.top .spacer{flex:1}
.search{position:relative;width:260px;max-width:30vw}
.search input{width:100%;height:34px;border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:0 10px 0 32px;font-size:13px}
.search input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--ring);background:var(--panel)}
.search svg{position:absolute;left:10px;top:9px;width:16px;height:16px;color:var(--faint)}
.icon-btn{position:relative;width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.icon-btn:hover{color:var(--ink);border-color:var(--faint)}
.icon-btn svg{width:18px;height:18px}
.icon-btn .dotn{position:absolute;top:5px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--bad);border:2px solid var(--panel)}
.who{display:flex;align-items:center;gap:10px;padding-left:12px;border-left:1px solid var(--line)}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--accent-soft);color:var(--accent-2);display:grid;place-items:center;font-weight:600;font-size:12px;flex:none}
.who .nm{display:flex;flex-direction:column;line-height:1.2}
.who .nm b{font-size:13px;font-weight:600}
.who select{border:0;background:none;color:var(--muted);font-size:11.5px;padding:0;cursor:pointer;max-width:200px}
.who select:focus-visible{outline:2px solid var(--accent)}
.asof{display:none}
.theme-sw{display:flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:9px;background:var(--panel2)}
.theme-sw button{width:28px;height:26px;border:0;border-radius:6px;background:none;color:var(--faint);display:grid;place-items:center;cursor:pointer}
.theme-sw button:hover{color:var(--ink)}
.theme-sw button.on{background:var(--panel);color:var(--accent);box-shadow:var(--shadow-sm)}
.theme-sw svg{width:16px;height:16px}

.shell{flex:1;display:grid;grid-template-columns:320px 1fr;min-height:0}
.shell.wide{grid-template-columns:1fr}
.list{background:var(--panel);border-right:1px solid var(--line);overflow:auto;min-height:0;display:flex;flex-direction:column}
.list-head{padding:18px 16px 12px;position:sticky;top:0;background:var(--panel);z-index:2;border-bottom:1px solid var(--line2);display:flex;flex-direction:column;gap:4px}
.list-head h2{font-size:15px;font-weight:600}
.list-items{display:flex;flex-direction:column;padding:8px}
.li{display:block;width:100%;text-align:left;border:1px solid transparent;background:none;padding:12px 12px;border-radius:9px;cursor:pointer;position:relative}
.li+.li{margin-top:2px}
.li:hover{background:var(--panel2)}
.li.on{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 22%,transparent)}
.li .t{font-weight:600;display:flex;gap:8px;align-items:flex-start;justify-content:space-between;color:var(--ink)}
.li .s{font-size:12px;color:var(--muted);margin-top:3px;display:flex;gap:10px;flex-wrap:wrap}
.detail{overflow:auto;min-height:0;padding:24px 28px 48px}
.detail-inner{max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:18px}

/* ---------- content ---------- */
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.head h1{font-size:22px;font-weight:600;letter-spacing:-.01em}
.kicker{font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:none;padding:10px 12px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.tabs .p2{font-size:9.5px;color:var(--gold-ink);background:var(--gold-soft);font-weight:700;margin-left:6px;padding:1px 5px;border-radius:4px;letter-spacing:.04em}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px 18px;box-shadow:var(--shadow-sm)}
.card h3{font-size:14px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:8px;justify-content:space-between;flex-wrap:wrap}
.card h3 .sub{font-weight:400;color:var(--muted);font-size:12px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:8px 20px;font-size:13px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:500;color:var(--ink2)}
.stat{display:flex;flex-direction:column;gap:4px}
.stat .l{font-size:12px;color:var(--muted);font-weight:500}
.stat .v{font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em;color:var(--ink)}
.stat .d{font-size:12px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap;line-height:18px}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.G{color:var(--ok);background:var(--ok-soft)} .pill.A{color:var(--warn);background:var(--warn-soft)} .pill.R{color:var(--bad);background:var(--bad-soft)}
.pill.N{color:var(--muted);background:var(--line2)} .pill.I{color:var(--info);background:var(--info-soft)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.dot.G{background:var(--ok)} .dot.A{background:var(--warn)} .dot.R{background:var(--bad)}
.tag{font-size:11px;padding:2px 7px;border-radius:5px;background:var(--line2);color:var(--muted);font-weight:500;white-space:nowrap}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
.card .tbl-wrap{box-shadow:none}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-weight:600;font-size:11.5px;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line);background:var(--panel2);white-space:nowrap;letter-spacing:.02em}
td{padding:10px 12px;border-bottom:1px solid var(--line2);vertical-align:middle;color:var(--ink2)}
tbody tr:hover td{background:color-mix(in srgb,var(--panel2) 70%,transparent)}
tr:last-child td{border-bottom:0}
td b{color:var(--ink)}
td.r,th.r{text-align:right}
tr.ms td{background:color-mix(in srgb,var(--gold-soft) 60%,transparent)}
tr.done td{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--panel);padding:0 14px;height:34px;border-radius:8px;cursor:pointer;font-weight:500;font-size:13px;white-space:nowrap;color:var(--ink);box-shadow:var(--shadow-sm)}
.btn:hover{border-color:var(--faint);background:var(--panel2)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.pri:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn.danger{color:var(--bad)}
.btn.warn{background:var(--gold-soft);color:var(--gold-ink);border-color:transparent;box-shadow:none}
.btn.sm{height:28px;padding:0 10px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted);font-weight:500}
.field input,.field select,.field textarea,.inp{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:0 10px;height:34px;font-size:13px;color:var(--ink);min-width:0}
.field select[multiple]{height:auto;padding:4px}
.field textarea,textarea.inp{height:auto;min-height:80px;padding:8px 10px;resize:vertical;line-height:1.5}
.field input:focus,.field select:focus,.field textarea:focus,.inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--ring)}
.inp.xs{width:66px;height:30px;padding:0 6px} .inp.date{width:140px;height:30px;padding:0 6px}
td .inp{height:30px}
form.inline{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));align-items:end}
.note{font-size:12.5px;color:var(--muted);background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:10px 14px}
.note b{color:var(--ink)}
.req{font-family:var(--mono);font-size:10px;color:var(--faint);white-space:nowrap;font-weight:400;letter-spacing:0}
.empty{padding:40px;text-align:center;color:var(--muted)}
.bar{height:6px;background:var(--line2);border-radius:5px;overflow:hidden;position:relative}
.bar i{display:block;height:100%;background:var(--brand);border-radius:5px}
.alert{display:flex;gap:14px;padding:14px 16px;border-radius:var(--r);background:var(--panel);border:1px solid var(--line);align-items:center;box-shadow:var(--shadow-sm)}
.alert .ic{width:4px;align-self:stretch;border-radius:4px;flex:none}
.alert.R .ic{background:var(--bad)} .alert.A .ic{background:var(--warn)} .alert.I .ic{background:var(--info)} .alert.G .ic{background:var(--ok)}
.alert .m{font-weight:600;color:var(--ink)} .alert .s{font-size:12px;color:var(--muted);margin-top:2px}
.timeline{display:flex;flex-direction:column;border-left:2px solid var(--line);margin-left:6px;padding-left:18px}
.timeline .ev{position:relative;padding:2px 0 14px}
.timeline .ev::before{content:"";position:absolute;left:-25px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--panel);border:2px solid var(--accent)}
.timeline .ev.ret::before{border-color:var(--bad)} .timeline .ev.ok::before{background:var(--ok);border-color:var(--ok)}
.timeline .ev .w{font-weight:600;color:var(--ink)} .timeline .ev .c{font-size:12.5px;margin-top:4px;background:var(--panel2);padding:7px 10px;border-radius:7px;border:1px solid var(--line2)}
.steps{display:flex;align-items:center;flex-wrap:wrap;font-size:12px;gap:0}
.steps span{display:flex;align-items:center;gap:8px;padding:6px 14px 6px 10px;color:var(--muted);font-weight:500}
.steps span::before{content:"";width:18px;height:18px;border-radius:50%;border:2px solid var(--line);background:var(--panel);flex:none}
.steps span+span{position:relative;padding-left:34px}
.steps span+span::after{content:"";position:absolute;left:4px;top:50%;width:22px;height:2px;background:var(--line)}
.steps span.done{color:var(--ok)} .steps span.done::before{background:var(--ok);border-color:var(--ok);box-shadow:inset 0 0 0 3px var(--panel)}
.steps span.cur{color:var(--ink);font-weight:600} .steps span.cur::before{border-color:var(--accent);box-shadow:inset 0 0 0 4px var(--accent-soft)}
.steps span.bad{color:var(--bad);font-weight:600} .steps span.bad::before{border-color:var(--bad);background:var(--bad-soft)}
.matrix{display:grid;grid-template-columns:24px repeat(5,1fr);gap:4px;font-size:11px}
.matrix .c{aspect-ratio:1.4;border-radius:6px;display:grid;place-items:center;font-weight:700;font-size:13px;color:#fff;max-width:100%}
.matrix .ax{display:grid;place-items:center;color:var(--muted);font-weight:600}
.lvL{background:#4E9E6C}.lvM{background:#D3A43A}.lvH{background:#D9772F}.lvC{background:#B8321F}
.matrix .c.zero{opacity:.22;color:transparent}
.gantt{position:relative;min-width:900px}
.g-row{display:grid;grid-template-columns:240px 1fr;align-items:center;border-bottom:1px solid var(--line2);min-height:32px}
.g-row:hover{background:var(--panel2)}
.g-row .n{font-size:12.5px;padding:4px 12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink2)}
.g-row .n .mono{color:var(--faint);margin-right:6px;font-size:11px}
.g-track{position:relative;height:32px}
.g-head{display:grid;grid-template-columns:240px 1fr;border-bottom:1px solid var(--line);background:var(--panel2);position:sticky;top:0;z-index:1}
.g-months{position:relative;height:30px}
.g-months span{position:absolute;top:0;bottom:0;border-left:1px solid var(--line);font-size:11px;color:var(--muted);padding:7px 6px;white-space:nowrap}
.g-grid{position:absolute;top:0;bottom:0;border-left:1px solid var(--line2)}
.g-base{position:absolute;height:4px;top:23px;background:var(--faint);opacity:.5;border-radius:3px}
.g-bar{position:absolute;height:12px;top:8px;border-radius:6px;background:color-mix(in srgb,var(--accent) 22%,transparent);overflow:hidden}
.g-bar i{display:block;height:100%;background:var(--accent)}
.g-bar.late{background:color-mix(in srgb,var(--bad) 20%,transparent)} .g-bar.late i{background:var(--bad)}
.g-bar.crit{box-shadow:0 0 0 2px var(--accent)} .cp-tag{display:inline-block;margin-left:6px;padding:0 5px;border-radius:4px;background:var(--accent);color:var(--accent-ink);font-size:9.5px;font-weight:700;letter-spacing:.04em;vertical-align:middle}
.g-ms{position:absolute;top:9px;width:11px;height:11px;transform:rotate(45deg);background:var(--gold);border-radius:2px}
.g-ms.done{background:var(--ok)} .g-ms.late{background:var(--bad)}
.g-ms-b{position:absolute;top:21px;width:7px;height:7px;transform:rotate(45deg);border:1.5px solid var(--faint);background:var(--panel)}

  for (const it of pendingApprovals()) out.push({ r: 'A', m: `PSR awaiting your approval`, s: `${it.p.code} · ${periodLabel(it.r.period)} · submitted by ${uname(it.p.pm)}`, go: ['approvals', it.r.id], req: 'ITPH-00149' });
  for (const n of (S.notes || []).filter(n => n.to === ui.me).slice(-15).reverse()) out.push({ r: 'I', m: n.m, s: n.s, go: n.go, req: n.req || '', unread: !n.read, at: n.at });
  const rank = { R: 0, A: 1, I: 2, G: 3 };
  return out.sort((a, b) => rank[a.r] - rank[b.r]);
}
function pendingApprovals() {
  const r = role(); const out = [];
  for (const p of S.projects) for (const x of p.psrs) {
    if (r === 'DH' && x.status === 'Submitted' && p.dh === ui.me) out.push({ p, r: x, step: 'DH' });
    if (r === 'PS' && x.status === 'For PS Approval' && p.ps === ui.me) out.push({ p, r: x, step: 'PS' });
  }
  return out;
}

function bpiAfterRender() {

    bar.innerHTML = `<span>Export</span>${[['csv', 'CSV'], ['xlsx', 'Excel'], ['pptx', 'PPT'], ['pdf', 'PDF']].map(([f, l]) => `<button class="btn sm ghost" data-a="exp" data-f="${f}" data-i="${i}">${l}</button>`).join('')}`;
    w.parentNode.insertBefore(bar, w);

function bpiReadTable(w) {
  const t = w.querySelector('table'); const heads = [...t.querySelectorAll('thead th')]; const keep = heads.map((h, i) => ({ i, name: h.innerText.replace(/\s+/g, ' ').trim() })).filter(x => x.name);
  const num = s => /^-?\d{1,3}(,\d{3})*(\.\d+)?$|^-?\d+(\.\d+)?$/.test(s) && !/^0\d/.test(s) ? Number(s.replace(/,/g, '')) : s;
  const rows = [...t.querySelectorAll('tbody tr')].map(tr => [...tr.children]).filter(c => c.length > 1).map(c => keep.map(k => num((c[k.i]?.innerText || '').replace(/\s*\n\s*/g, ' ').replace(/\s+/g, ' ').trim())));
  const card = w.closest('.card'); const h = card?.querySelector('h3'); const title = ((h?.childNodes[0]?.textContent || document.querySelector('h1')?.textContent || 'Export').replace(/\s+/g, ' ').trim()) || 'Export';
  return { title, cols: keep.map(k => k.name), rows };
}
async function bpiExport(fmt, i) {

function bpiDataset(name) {
  const B = window.__ITPH_BINDER; const ps = role() === 'APPADMIN' ? S.projects : myProjects(); const out = []; // administrators (Hub Administrator, TPMO) see every project
  for (const p of ps) {
    const h = health(p); const sc = h.sc; const pn = p.name;
    if (name === 'projects') out.push({ name: pn, code: p.code, bu: p.bu, segment: ((S.programs || []).find(g => g.id === p.program)?.segment) || p.bu || '', program: (S.programs || []).find(g => g.id === p.program)?.name || '', status: p.status || '', pm: uname(p.pm), dh: uname(p.dh), sponsor: uname(p.ps), rag: RAGL[h.overall], kpi: sc.kpi === null ? '' : +sc.kpi.toFixed(2), complete: +sc.complete.toFixed(1), planned: +sc.expected.toFixed(1), baseFinish: sc.baseFinish, foreFinish: sc.foreFinish, variance: sc.variance, budget: Math.round(h.f.current), eac: Math.round(p.fin.eac), actualCost: Math.round(p.fin.actual) });
    if (name === 'tasks') for (const a of p.activities) out.push({ project: pn, id: a.id, name: a.name, type: a.ms ? 'Milestone' : 'Task', owner: uname(a.owner), bStart: a.bStart, bFinish: a.bFinish, start: a.fStart, finish: a.fFinish, pct: a.pct, budget: +a.cost || 0, actual: +a.actual || 0, critical: p.crit && p.crit.has(a.id) ? 'Yes' : '' });
    if (name === 'risks') for (const r of p.risks) { const e = bndExt(p, 'Risk', r.id) || {}; out.push({ project: pn, no: r.id, title: r.title, category: r.cat, level: riskLevel(riskScore(r)), owner: uname(r.owner), status: r.status, target: e.target || '', agingRag: RAGL[B.agingRag(B.agingDays({ target: e.target, actionStatus: e.actionStatus, closed: r.status === 'Closed' }, TODAY))] }); }
    if (name === 'issues') for (const i of p.issues) out.push({ project: pn, no: i.id, title: i.title, category: i.cat, priority: i.pri, owner: uname(i.owner), status: i.status, target: i.target, agingRag: RAGL[B.agingRag(B.agingDays({ target: i.target, actionStatus: '', closed: i.status === 'Resolved' }, TODAY))] });
    if (name === 'binder') for (const it of bndItems(p)) { const d = B.agingDays({ target: it.target, actionStatus: it.actionStatus, closed: it.closed }, TODAY); out.push({ project: pn, type: it.type, no: it.no, description: it.desc, category: it.cat, priority: it.pri, assignee: uname(it.assignee), target: it.target, actionStatus: it.actionStatus, aging: d, agingRag: RAGL[B.agingRag(d)], status: it.closed ? 'Closed' : 'Open' }); }
    if (name === 'releases') for (const r of p.releases || []) out.push({ project: pn, name: r.name, kind: r.mvp ? 'MVP' : 'Release', planned: r.planned, forecast: r.forecast, implemented: r.implemented, cls: window.__ITPH_DASH.releaseForecast([{ planned: r.planned, forecast: r.forecast, implemented: r.implemented }], TODAY)[0]?.items[0]?.cls || '' });
    if (name === 'weekly') for (const w of p.wsr || []) out.push({ project: pn, week: w.weekOf, status: w.status, kpi: w.kpi === null ? '' : +(+w.kpi).toFixed(2), kpiRag: RAGL[w.kpiRag] || '', overall: RAGL[w.overall] || '', projectStatus: w.projectStatus });
  }
  return out;
}

function gantt(p, h, list) {
  if (!p.activities.length) return '<div class="empty">Add tasks or milestones in the table view to see them on the Gantt chart.</div>';

  const e0 = [...all.map(a => a.bFinish), ...all.map(a => a.fFinish)].sort().pop();
  const start = s0.slice(0, 8) + '01'; const endD = D(e0); const end = iso(new Date(Date.UTC(endD.getUTCFullYear(), endD.getUTCMonth() + 2, 1)));
  const span = calDiff(start, end); const x = s => calDiff(start, s) / span * 100; const wdt = (a, b) => Math.max(0.35, (calDiff(a, b) + 1) / span * 100);
  const months = []; let d = start; while (d < end) { months.push(d); const dd = D(d); d = iso(new Date(Date.UTC(dd.getUTCFullYear(), dd.getUTCMonth() + 1, 1))); }
  return `<div class="legend"><span><i class="g-bar" style="position:static;display:inline-block;width:26px;height:10px"></i>Forecast / actual</span><span><i style="width:26px;height:4px;background:var(--faint);opacity:.55;border-radius:3px"></i>Baseline</span>

  ${ed ? `<div class="note"><b>Drag a bar</b> to move an activity that hasn't started. <b>Drag its right edge</b> to change the duration or the forecast finish. Dependent activities move with it, and the grey baseline stays put so you can see the variance. Completed activities are locked.</div>` : ''}
  <div class="tbl-wrap"><div class="gantt" data-gs="${start}" data-gspan="${span}" data-p="${p.id}">
    <div class="g-head"><div class="n muted" style="padding:6px 10px;font-size:11.5px;font-weight:600">Activity</div><div class="g-months">${months.map(m => `<span style="left:${x(m)}%">${MON[D(m).getUTCMonth()]} ${String(D(m).getUTCFullYear()).slice(2)}</span>`).join('')}</div></div>
    ${ganttRows(p, acts, ed, x, wdt, months)}
  </div></div><div id="gtip" class="gtip" hidden></div>`;
}

/* ---------- Gantt drag ---------- */
let drag = null;
document.addEventListener('pointerdown', e => {
  const h = e.target.closest('[data-rs]'); const b = h ? null : e.target.closest('[data-drag]');
  if (!h && !b) return;
  const g = e.target.closest('.gantt'); const track = e.target.closest('.g-track');
  const el = h ? h.parentElement : b;
  drag = { mode: h ? 'resize' : 'move', id: (h || b).dataset.rs || (h || b).dataset.drag, x0: e.clientX, w: track.getBoundingClientRect().width, span: +g.dataset.gspan, el, width0: el.getBoundingClientRect().width, p: g.dataset.p, days: 0 };
  el.setPointerCapture(e.pointerId); el.classList.add('dragging'); e.preventDefault();
});
document.addEventListener('pointermove', e => {
  if (!drag) return;
  const dx = e.clientX - drag.x0; drag.days = Math.round(dx / drag.w * drag.span);
  if (drag.mode === 'move') drag.el.style.transform = `translateX(${dx}px)${drag.el.classList.contains('g-ms') ? ' rotate(45deg)' : ''}`;
  else drag.el.style.width = Math.max(6, drag.width0 + dx) + 'px';
  const p = proj(drag.p); const a = p.activities.find(x => x.id === drag.id);
  const tip = document.getElementById('gtip');
  if (tip) { tip.hidden = false; tip.style.left = (e.clientX + 14) + 'px'; tip.style.top = (e.clientY + 14) + 'px';
    tip.textContent = drag.mode === 'move' ? `Start ${fd(toWork(addDays(a.fStart, drag.days)))} (${drag.days >= 0 ? '+' : ''}${drag.days} days)` : `Finish ${fd(toWork(addDays(a.fFinish, drag.days)))} (${drag.days >= 0 ? '+' : ''}${drag.days} days)`; }
});
document.addEventListener('pointerup', () => {
  if (!drag) return; const dd = drag; drag = null;
  const tip = document.getElementById('gtip'); if (tip) tip.hidden = true;
  if (!dd.days) { dd.el.style.transform = ''; dd.el.style.width = ''; dd.el.classList.remove('dragging'); return; }
  const p = proj(dd.p); const a = p.activities.find(x => x.id === dd.id); const by = Object.fromEntries(p.activities.map(x => [x.id, x]));
  let msg;
  if (dd.mode === 'move') {
    let ns = toWork(addDays(a.fStart, dd.days));
    const earliest = window.__ITPH_WBS.predConstraint(a, by, { nextWD, prevWD }) || toWork(p.start);
    if (ns < earliest) { ns = earliest; msg = `${a.id} can't start before its predecessors finish. Moved to ${fd(ns)}.`; }
    if (ns < TODAY) { ns = toWork(TODAY); msg = `${a.id} can't start in the past. Moved to ${fd(ns)}.`; }
    const old = a.fStart; a.pStart = ns; a.manualFinish = '';
    logSched(p, `${a.id} ${a.name}: moved start ${fd(old)} → ${fd(ns)} (Gantt)`);
  } else {
    let nf = toWork(addDays(a.fFinish, dd.days));
    if (a.aStart) { if (nf < TODAY) nf = toWork(TODAY); const old = a.fFinish; a.manualFinish = nf; logSched(p, `${a.id} ${a.name}: forecast finish ${fd(old)} → ${fd(nf)} (Gantt)`); }
    else { if (nf < a.fStart) nf = a.fStart; const old = a.dur; a.dur = Math.max(1, wdDiff(a.fStart, nf) + 1); logSched(p, `${a.id} ${a.name}: duration ${old} → ${a.dur} working days (Gantt)`); }
  }
  const before = schedule(p).foreFinish;
  S.projects.forEach(schedule);
  audit('Modify', `Activity ${a.id} (${p.code}) via Gantt`);
  const after = schedule(p).foreFinish;
  toast(msg || `Schedule updated. Project forecast finish: ${fd(after)}`);
  save(); render();
});

/* ---------- S-curve ---------- */
function curvePoints(p, mode) {
  const wt = a => (mode === 'cost' ? (+a.cost || 0) : a.dur);
  const acts = p.activities.filter(a => !a.ms); const tot = acts.reduce((s, a) => s + wt(a), 0) || 1;
  const sc = schedule(p);
  const endAll = [sc.baseFinish, sc.foreFinish].sort().pop();
  const dates = []; let d = p.start; while (d < endAll) { dates.push(d); d = addDays(d, 7); } dates.push(endAll);
  if (!dates.includes(TODAY)) dates.push(TODAY); dates.sort();
  const frac = (s, f, at) => { if (at < s) return 0; if (at >= f) return 1; return Math.min(1, (wdDiff(s, at) + 1) / (wdDiff(s, f) + 1)); };
  const planned = at => acts.reduce((s, a) => s + wt(a) * frac(a.bStart, a.bFinish, at), 0) / tot * 100;
  const actual = at => acts.reduce((s, a) => { if (!a.aStart || at < a.aStart) return s; const end = a.aFinish || TODAY; const target = a.aFinish ? 100 : a.pct; return s + wt(a) * target / 100 * frac(a.aStart, end, at); }, 0) / tot * 100;
  const forecast = at => acts.reduce((s, a) => { if (a.pct >= 100) return s + wt(a); const from = a.aStart ? TODAY : a.fStart; return s + wt(a) * (a.pct + (100 - a.pct) * frac(from < TODAY ? TODAY : from, a.fFinish, at)) / 100; }, 0) / tot * 100;
  return dates.map(dt => ({ d: dt, pl: planned(dt), ac: dt <= TODAY ? actual(dt) : null, fc: dt >= TODAY ? forecast(dt) : null }));
}
function tSCurve(p, h) {
  if (ui.scMode === 'cost' && p.activities.length) return tSCurveCost(p);
  if (!p.activities.length) return '<div class="empty">Add activities in the Schedule tab to see the S-curve.</div>';
  const pts = curvePoints(p); const sc = h.sc;
  const now = pts.find(x => x.d === TODAY); const spi = now.pl ? now.ac / now.pl : 1; const gap = now.ac - now.pl;
  const W = 820, H = 330, L = 46, R = 104, T = 18, B = 36;
  const t0 = D(pts[0].d).getTime(), t1 = D(pts.at(-1).d).getTime();
  const X = dt => L + (D(dt).getTime() - t0) / (t1 - t0) * (W - L - R); const Y = v => T + (1 - v / 100) * (H - T - B);
  const path = (k) => pts.filter(q => q[k] != null).map((q, i) => `${i ? 'L' : 'M'}${X(q.d).toFixed(1)},${Y(q[k]).toFixed(1)}`).join('');
  const months = []; let m = pts[0].d.slice(0, 8) + '01'; while (m <= pts.at(-1).d) { if (m >= pts[0].d) months.push(m); const dd = D(m); m = iso(new Date(Date.UTC(dd.getUTCFullYear(), dd.getUTCMonth() + 1, 1))); }
  const step = months.length > 10 ? 2 : 1;
  const lastPl = pts.at(-1); const fcEnd = pts.filter(q => q.fc != null).at(-1);
  window._sc = { pts, X, Y, W, H, L, R, T, B };

    <div class="scurve-wrap"><svg class="scurve" viewBox="0 0 ${W} ${H}" role="img" aria-label="S-curve: planned ${pct(now.pl)}, actual ${pct(now.ac)} as of ${fd(TODAY)}">
      ${[0, 25, 50, 75, 100].map(v => `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" class="sc-grid"/>${lbl(L - 8, Y(v) + 4, v + '%', 'sc-ax sc-r')}`).join('')}
      ${months.map((mm, i) => i % step ? '' : lbl(X(mm), H - B + 18, MON[D(mm).getUTCMonth()] + ' ' + String(D(mm).getUTCFullYear()).slice(2), 'sc-ax sc-c')).join('')}
      <line x1="${X(TODAY)}" x2="${X(TODAY)}" y1="${T}" y2="${H - B}" class="sc-today"/>${lbl(X(TODAY), T - 5, 'Today', 'sc-ax sc-c')}

document.addEventListener('pointermove', e => {
  const hit = e.target.closest && e.target.closest('.scurve'); const wrap = document.querySelector('.scurve-wrap');
  if (!wrap || !window._sc) return; const tip = wrap.querySelector('.sc-tip'); const ln = wrap.querySelector('.sc-hover');
  if (!hit) { tip.hidden = true; ln.style.display = 'none'; return; }
  const svg = wrap.querySelector('svg'); const r = svg.getBoundingClientRect(); const c = window._sc;
  const vx = (e.clientX - r.left) / r.width * c.W; if (vx < c.L || vx > c.W - c.R) { tip.hidden = true; ln.style.display = 'none'; return; }
  let best = c.pts[0]; for (const q of c.pts) if (Math.abs(c.X(q.d) - vx) < Math.abs(c.X(best.d) - vx)) best = q;
  ln.setAttribute('x1', c.X(best.d)); ln.setAttribute('x2', c.X(best.d)); ln.style.display = '';
  tip.hidden = false;
  tip.innerHTML = `<b>${fd(best.d)}</b><div><span class="k" style="border-color:var(--s-plan)"></span>Planned <b>${best.pl.toFixed(1)}%</b></div>${best.ac != null ? `<div><span class="k" style="border-color:var(--s-act)"></span>Actual <b>${best.ac.toFixed(1)}%</b></div>` : ''}${best.fc != null && best.d !== TODAY ? `<div><span class="k dash" style="border-color:var(--s-act)"></span>Forecast <b>${best.fc.toFixed(1)}%</b></div>` : ''}`;
  const px = c.X(best.d) / c.W * r.width; tip.style.left = Math.min(px + 12, r.width - 170) + 'px'; tip.style.top = (r.height * 0.42) + 'px';
});

/* ---------- My tasks ---------- */
function vMyTasks() {
  const rows = []; const acts = [];

    for (const a of p.activities) if (a.owner === ui.me && a.pct < 100) acts.push({ p, a });
    for (const i of p.issues) for (const x of i.actions) if (x.who === ui.me) rows.push({ p, i, x });
  }

/* ---------- Chat ---------- */
function unreadFor(pid) { const n = (S.chat[pid] || []).length; const r = ((S.reads[ui.me] || {})[pid]) || 0; return Math.max(0, n - r); }
function refLabel(p, ref) {
  if (!ref) return ''; const [t, id] = ref.split(':');
  if (t === 'act') { const a = [...p.activities, ...(p.wbs || [])].find(x => x.id === id); return a ? `${a.id} · ${a.name}` : id; }
  const i = p.issues.find(x => x.id === id); return i ? `${i.id} · ${i.title}` : id;
}
function fmtMsg(text) {
  return esc(text).replace(/@([a-z0-9._]+)/gi, (m, u) => S.users.some(x => x.uid.toLowerCase() === u.toLowerCase()) ? `<span class="mention">@${u}</span>` : m).replace(/\n/g, '<br>');
}
function chatThread(p) {
  S.reads[ui.me] = S.reads[ui.me] || {}; S.reads[ui.me][p.id] = (S.chat[p.id] || []).length; save();
  const msgs = S.chat[p.id] || []; let lastDay = '', lastWho = '';
  const members = [...new Set([p.pm, p.dh, p.ps, ...p.activities.map(a => a.owner), ...p.issues.map(i => i.owner), 'U05', 'U06'])].map(user).filter(u => u.status !== 'Inactive');
  const refOpts = [...[...p.activities, ...(p.wbs || [])].map(a => [`act:${a.id}`, `${a.id} · ${a.name}`]), ...p.issues.map(i => [`issue:${i.id}`, `${i.id} · ${i.title}`])];
  return `<div class="chat">
    <div class="chat-head"><div><b>${esc(p.name)}</b><div class="muted" style="font-size:12px">${members.length} members · project discussion</div></div><div class="avs">${members.slice(0, 6).map(u => `<span class="av" title="${esc(u.name)}">${initialsOf(u.id)}</span>`).join('')}${members.length > 6 ? `<span class="av more">+${members.length - 6}</span>` : ''}</div></div>
    <div class="msgs" id="msgs">${msgs.map(m => { const day = m.at.slice(0, 10); const sameGroup = day === lastDay && m.who === lastWho; const out = (day !== lastDay ? `<div class="day"><span>${fd(day)}</span></div>` : '') +
      `<div class="msg ${m.who === ui.me ? 'me' : ''} ${sameGroup ? 'cont' : ''}">${sameGroup ? '<span class="av ghost"></span>' : `<span class="av">${initialsOf(m.who)}</span>`}<div class="bub">${sameGroup ? '' : `<div class="meta"><b>${esc(uname(m.who))}</b><span class="tag">${ROLE_LABEL[user(m.who).role] || ''}</span><span class="faint">${m.at.slice(11, 16)}</span></div>`}
        ${m.ref ? `<button class="ref" data-a="gochip" data-p="${p.id}" data-ref="${m.ref}">${m.ref.startsWith('act') ? ic.proj : ic.bell}${esc(refLabel(p, m.ref))}</button>` : ''}<div class="txt">${fmtMsg(m.text)}</div></div></div>`;
      lastDay = day; lastWho = m.who; return out; }).join('') || '<div class="empty">No messages yet. Start the conversation.</div>'}</div>
    <div class="composer">
      ${ui.chatRef ? `<div class="row" style="gap:6px"><span class="ref static">${esc(refLabel(p, ui.chatRef))}</span><button class="btn sm ghost" data-a="clearref" aria-label="Remove link">✕</button></div>` : ''}
      <textarea id="chatbox" rows="2" placeholder="Write a message. Use @ to mention someone, e.g. @pgarcia" data-c="draft" data-p="${p.id}">${esc((ui.draft || {})[p.id] || '')}</textarea>
      <div class="row" style="justify-content:space-between">
        <div class="row" style="gap:6px">
          <select class="inp" style="height:30px;max-width:220px" data-c="chatref" aria-label="Link to activity or issue"><option value="">Link to activity or issue…</option>${refOpts.map(([v, l]) => `<option value="${v}" ${ui.chatRef === v ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select>
          <select class="inp" style="height:30px;max-width:170px" data-c="mention" aria-label="Mention someone"><option value="">Mention…</option>${members.filter(u => u.id !== ui.me).map(u => `<option value="${u.uid}">@${u.uid} · ${esc(u.name)}</option>`).join('')}</select>
        </div>
        <div class="row" style="gap:10px"><span class="faint" style="font-size:11.5px">Enter to send · Shift+Enter for a new line</span><button class="btn pri sm" data-a="send" data-p="${p.id}">Send</button></div>
      </div>
    </div></div>`;
}

      <p class="note" style="margin-top:12px">High and Critical risks escalate to the PSC view ${req('ITPH-0048 · 0049')}. Residual rating shows the expected level after mitigation ${req('0047')}.</p></div></div>
  <div class="tbl-wrap"><table><thead><tr><th>ID</th><th>Risk</th><th class="r">P</th><th class="r">I</th><th>Rating</th><th>Response</th><th>Mitigation</th><th>Residual</th><th>Owner</th></tr></thead><tbody>
  ${p.risks.map(r => { const lv = riskLevel(riskScore(r)); const rl = riskLevel(r.rp * r.ri);

const TALA_IC = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 3.5c-7.5 0-13.5 3.4-14.6 10.1-.2 1.3-.2 2.6.1 3.8L3.2 19.7l1.1 1.1 2.3-2.3c1.2.3 2.5.3 3.8.1C17.1 17.5 20.5 11.5 20.5 4v-.5zM8.2 17.3l7-7-.9-.9-7 7c-.2-.8-.2-1.7 0-2.6C8 9 12.4 6.2 18.4 5.6c-.6 6-3.4 10.4-8.2 11.1-.7.2-1.4.2-2 .6z"/></svg>';

/* ---------- data helpers the agent reads ---------- */
function findProject(code) {
  const c = String(code || '').trim().toLowerCase();
  const ps = myProjects();
  return ps.find(p => p.code.toLowerCase() === c || p.id.toLowerCase() === c) || ps.find(p => p.name.toLowerCase().includes(c) || c.includes(p.code.slice(-3))) || null;
}
function projectedLD(p) {
  let t = 0; for (const a of p.activities.filter(x => x.ms && x.price)) { const end = a.pct >= 100 ? a.aFinish : a.fFinish; const d = Math.max(0, calDiff(a.bFinish, end)); t += S.config.ldRate * a.price * d; } return t;
}
function projSummary(p) {
  const h = health(p);
  return { code: p.code, name: p.name, business_unit: p.bu, pm: uname(p.pm), health: RAGL[h.overall], health_reasons: h.reasons, needs_attention: h.attention,
    complete_pct: +h.sc.complete.toFixed(1), planned_pct_to_date: +h.sc.expected.toFixed(1), baseline_finish: h.sc.baseFinish, forecast_finish: h.sc.foreFinish, variance_working_days: h.sc.variance,
    forecast_cost_pct_of_budget: +h.f.eacPct.toFixed(1), contingency_used_pct: +h.f.contPct.toFixed(1) };
}
function projDetail(p) {
  const h = health(p); const L = ld(p); const last = p.psrs.at(-1);
  return { ...projSummary(p), vendor: p.vendor, contract_price: p.contract, contract_expiry: p.expiry,
    activities: p.activities.map(a => ({ id: a.id, name: a.name, milestone: a.ms, owner: uname(a.owner), owner_user_id: user(a.owner).uid, predecessors: a.preds, duration_wd: a.dur, pct: a.pct, baseline_finish: a.bFinish, forecast_start: a.fStart, forecast_finish: a.fFinish, status: actState(a).l })),
    risks: p.risks.map(r => ({ id: r.id, title: r.title, category: r.cat, probability: r.p, impact: r.i, level: riskLevel(riskScore(r)), response: r.resp, mitigation: r.mit, owner: uname(r.owner), status: r.status })),
    issues: p.issues.map(i => ({ id: i.id, title: i.title, priority: i.pri, owner: uname(i.owner), target: i.target, status: i.status, escalated: issueEsc(i), actions: i.actions.map(a => ({ text: a.text, who: uname(a.who), due: a.due, status: a.status })) })),
    finance: { current_budget: h.f.current, actual: p.fin.actual, committed: p.fin.committed, forecast_at_completion: p.fin.eac, contingency: p.fin.contingency, contingency_used: h.f.used },
    liquidated_damages: { to_date: Math.round(L.total), pct_of_contract: +L.pctOfContract.toFixed(2), projected_at_forecast_dates: Math.round(projectedLD(p)), rule: `${S.config.ldRate} x undelivered value x days late, cap ${S.config.ldCap}%` },
    latest_psr: last ? { period: periodLabel(last.period), status: last.status } : null,
    recent_discussion: (S.chat[p.id] || []).slice(-6).map(m => ({ who: uname(m.who), at: m.at, text: m.text })) };
}
function simulate(p, actId, days) {
  const before = schedule(p); const ldBefore = projectedLD(p);
  const c = JSON.parse(JSON.stringify(p)); const a = c.activities.find(x => x.id === String(actId).toUpperCase());
  if (!a) throw new Error(`No activity ${actId} in ${p.code}`);
  if (a.pct >= 100) throw new Error(`${a.id} is already complete`);
  days = Math.round(Number(days) || 0);
  if (a.aStart) a.manualFinish = addWD(a.fFinish, days); else a.pStart = addWD(a.fStart, days);
  const after = schedule(c);
  const ms = c.activities.filter(x => x.ms).map(x => ({ milestone: x.name, before: p.activities.find(y => y.id === x.id).fFinish, after: x.fFinish })).filter(x => x.before !== x.after);
  return { project: p.code, activity: `${a.id} ${a.name}`, slip_working_days: days, forecast_finish_before: before.foreFinish, forecast_finish_after: after.foreFinish,
    project_delay_working_days: wdDiff(before.foreFinish, after.foreFinish), milestones_moved: ms, projected_ld_before: Math.round(ldBefore), projected_ld_after: Math.round(projectedLD(c)),
    contract_expiry: p.expiry, finishes_after_contract_expiry: after.foreFinish > p.expiry };
}
function myTasksData() {
  const out = [];
  for (const p of S.projects) {
    for (const a of p.activities) if (a.owner === ui.me && a.pct < 100) out.push({ project: p.code, type: 'activity', id: a.id, name: a.name, pct: a.pct, forecast_finish: a.fFinish, baseline_finish: a.bFinish, status: actState(a).l });
    for (const i of p.issues) for (const x of i.actions) if (x.who === ui.me && x.status !== 'Done') out.push({ project: p.code, type: 'action', name: x.text, due: x.due, overdue: x.due < TODAY });
  }
  return out;
}

/* ---------- proposals (human-in-the-loop) ---------- */
function describeProposal(x) {
  const p = proj(x.pid);
  switch (x.type) {
    case 'assign': return `Assign ${x.act} to ${uname(x.user)} (${p.code})`;
    case 'move_start': return `Move the start of ${x.act} to ${fd(x.date)} (${p.code})`;
    case 'set_progress': return `Set ${x.act} to ${x.pct}% complete (${p.code})`;
    case 'add_risk': return `Add risk "${x.title}" · P${x.prob} × I${x.impact} (${p.code})`;
    case 'add_action': return `Add action "${x.title}" to ${x.issue} for ${uname(x.user)}, due ${fd(x.date)} (${p.code})`;
    case 'psr_narrative': return `Fill the ${periodLabel(curPeriod())} PSR narrative (${p.code})`;
    case 'post_message': return `Post to the ${p.code} discussion as you`;
  } return x.type;
}
function makeProposal(input) {
  if (!actionsAllowed()) throw new Error('AVA suggestions are turned off by the administrator');
  if (!['assign', 'move_start', 'set_progress', 'add_risk', 'add_action', 'psr_narrative', 'post_message'].includes(input.type)) throw new Error('Unknown proposal type');
  const p = findProject(input.project_code); if (!p) throw new Error('Unknown project code. Use a code like PRJ-2026-014.');
  const x = { id: 'PR' + (++T.seq), pid: p.id, type: String(input.type), status: 'pending' };
  const act = input.activity_id ? p.activities.find(a => a.id === String(input.activity_id).toUpperCase()) : null;
  const usr = input.user_id ? S.users.find(u => u.uid.toLowerCase() === String(input.user_id).toLowerCase() || u.name.toLowerCase() === String(input.user_id).toLowerCase()) : null;
  if (['assign', 'move_start', 'set_progress'].includes(x.type) && !act) throw new Error('activity_id not found in that project');
  if (act) x.act = act.id;
  if (x.type === 'assign') { if (!usr) throw new Error('user_id not found; use a user ID like pgarcia'); x.user = usr.id; }
  if (x.type === 'move_start') { if (!/^\d{4}-\d{2}-\d{2}$/.test(String(input.date))) throw new Error('date must be YYYY-MM-DD'); if (act.aStart) throw new Error(`${act.id} has started; its start cannot move`); x.date = toWork(String(input.date)); }
  if (x.type === 'set_progress') x.pct = Math.max(0, Math.min(100, Math.round(Number(input.pct) || 0)));
  if (x.type === 'add_risk') { x.title = String(input.title || '').slice(0, 140); x.prob = Math.max(1, Math.min(5, +input.probability || 3)); x.impact = Math.max(1, Math.min(5, +input.impact || 3)); x.mit = String(input.mitigation || '').slice(0, 240); x.cat = String(input.category || 'Technical'); if (!x.title) throw new Error('title required'); }
  if (x.type === 'add_action') { const iss = p.issues.find(i => i.id === String(input.issue_id)); if (!iss) throw new Error('issue_id not found'); x.issue = iss.id; x.title = String(input.title || '').slice(0, 160); x.user = (usr || user(p.pm)).id; x.date = /^\d{4}-\d{2}-\d{2}$/.test(String(input.date)) ? String(input.date) : addWD(TODAY, 5); }
  if (x.type === 'psr_narrative') { x.acc = String(input.accomplishments || ''); x.next = String(input.next_period || ''); x.issues = String(input.issues || ''); }
  if (x.type === 'post_message') { x.text = String(input.text || '').slice(0, 1200); if (!x.text) throw new Error('text required'); }
  if (!describeProposal(x)) throw new Error('unknown type');
  T.pending[x.id] = x; addMsg({ role: 'proposal', id: x.id }); return x;
}
function applyProposal(id) {
  const x = T.pending[id]; if (!x || x.status !== 'pending') return; const p = proj(x.pid);
  if (!p || !myProjects().some(v => v.id === p.id)) { x.status = 'dismissed'; toast('Project access changed. This proposal was dismissed.'); renderTala(); return; }
  if (!actionsAllowed()) { toast('AVA suggestions are turned off by the administrator.'); return; }
  if (x.type === 'psr_narrative' && x.avaFingerprint && (x.avaFingerprint !== avaFingerprint(p) || x.period.y !== curPeriod().y || x.period.m !== curPeriod().m)) { x.status = 'dismissed'; toast('Project data or reporting period changed. Ask AVA to review again.'); renderTala(); return; }
  const needsPM = ['assign', 'move_start', 'add_risk', 'add_action', 'psr_narrative'].includes(x.type);
  const a = x.act ? p.activities.find(y => y.id === x.act) : null;
  if (x.act && !a) { x.status = 'dismissed'; toast(`${x.act} is no longer a task you can update (it now has items under it, or was deleted). Ask AVA again.`); renderTala(); return; }
  if (needsPM && !(canEdit(p) || (x.type === 'add_risk' && role() === 'QA'))) { toast('Only the project manager can apply this change'); return; }
  if (x.type === 'set_progress' && !canEditAct(p, a)) { toast('You can only update activities assigned to you'); return; }
  if (x.type === 'assign') { a.owner = x.user; S.notes.push({ to: x.user, m: `You were assigned ${a.id} ${a.name}`, s: `${p.code} · by ${me().name}`, go: ['mytasks'], at: nowStamp(), read: false }); logSched(p, `${a.id}: reassigned to ${uname(x.user)} (suggested by AVA)`); }
  if (x.type === 'move_start') { a.pStart = x.date; a.manualFinish = ''; logSched(p, `${a.id}: start moved to ${fd(x.date)} (suggested by AVA)`); }
  if (x.type === 'set_progress') { a.pct = x.pct; if (x.pct > 0 && !a.aStart) a.aStart = a.fStart <= TODAY ? a.fStart : TODAY; if (x.pct === 100) a.aFinish = TODAY; logSched(p, `${a.id}: % complete → ${x.pct} (suggested by AVA)`); }
  if (x.type === 'add_risk') p.risks.push({ id: `R-${p.code.slice(-3)}-${String(p.risks.length + 1).padStart(2, '0')}`, title: x.title, cat: x.cat, p: x.prob, i: x.impact, owner: p.pm, resp: 'Mitigate', mit: x.mit || 'To be defined', rp: Math.max(1, x.prob - 1), ri: x.impact, status: 'Open', raised: TODAY });
  if (x.type === 'add_action') p.issues.find(i => i.id === x.issue).actions.push({ id: uid('AC'), text: x.title, who: x.user, due: x.date, status: 'Open' });
  if (x.type === 'psr_narrative') { const cp = curPeriod(); let r = p.psrs.find(q => q.period.y === cp.y && q.period.m === cp.m); if (!r) { r = makePSR(p, cp); p.psrs.push(r); }
    if (!['Draft', 'Returned'].includes(r.status)) { toast('That PSR is already submitted'); return; } r.narrative = { acc: x.acc, next: x.next, issues: x.issues }; }
  if (x.type === 'post_message') (S.chat[p.id] = S.chat[p.id] || []).push({ id: uid('M'), who: ui.me, at: nowStamp(), text: x.text, ref: '' });
  x.status = 'applied'; x.by = ui.me;
  audit('AI suggestion accepted', describeProposal(x)); S.projects.forEach(schedule); save(); render(); renderTala(); toast('Applied');
}
function dismissProposal(id) { const x = T.pending[id]; if (!x) return; x.status = 'dismissed'; audit('AI suggestion rejected', describeProposal(x)); save(); renderTala(); }

  if (am && p) { if (!canEdit(p)) return 'Only the project manager can assign activities.'; try { makeProposal({ type: 'assign', project_code: p.code, activity_id: am[1], user_id: am[2].trim() }); return `Here's the change. Click **Apply** to assign ${am[1].toUpperCase()}.`; } catch (e) { return e.message; } }
  const pm = q.match(/(?:set|update|mark)\s+([A-Z]\d{1,2})\s+(?:to|at|as)\s+(\d{1,3})\s*%/i);
  if (pm && p) { try { makeProposal({ type: 'set_progress', project_code: p.code, activity_id: pm[1], pct: +pm[2] }); return `Here's the update. Click **Apply** to save it.`; } catch (e) { return e.message; } }
  const nm = s.match(/\b(?:open|go to|show|take me to)\s+(?:the\s+)?(portfolio|schedule|gantt|issues|risks|financials|s-?curve|psr|status reports?|discussions?|my tasks|approvals|notifications|overview)/);

  if (/my task|assigned to me|what.*(do|work on)/.test(s)) { const t = myTasksData(); if (!t.length) return 'You have no open tasks.'; bot.nav = { view: 'mytasks' }; return `You have **${t.length}** open items:\n${t.slice(0, 6).map(x => '- ' + (x.type === 'activity' ? `${x.project} ${x.id} ${x.name}, ${x.pct}% done, due ${fd(x.forecast_finish)}` : `${x.project} action: ${x.name}, due ${fd(x.due)}`)).join('\n')}`; }

}

function basicAnswer(q, bot) {
  const s = q.toLowerCase();
  if (/\bhow (do|can|to)\b|\bwhere\b/.test(s)) { const hh = helpMatch(q); if (hh) { if (bot) bot.nav = hh.go; return helpText(hh); } } const p = contextProject() || (/prj-\d{4}-\d{3}/i.test(q) ? findProject(q.match(/prj-\d{4}-\d{3}/i)[0]) : null);

  if (p && /deliverables?/.test(s)) return wbsDeliverableAnswer(p);

    const idm = q.match(/\b([A-Z]\d{1,2})\b/); const dm = q.match(/(-?\d+)\s*(working )?days?/i);
    const a = idm ? p.activities.find(x => x.id === idm[1]) : p.activities.find(x => x.pct < 100 && !x.ms && x.aStart) || p.activities.find(x => x.pct < 100);
    const days = dm ? +dm[1] : 10;
    try { const r = simulate(p, a.id, days); T.msgs.push({ role: 'insight', kind: 'sim', data: r }); return `If **${r.activity}** slips ${days} wd, the project finishes **${fd(r.forecast_finish_after)}** instead of ${fd(r.forecast_finish_before)} (${r.project_delay_working_days > 0 ? '+' : ''}${r.project_delay_working_days} wd).\n${bullets([...r.milestones_moved.slice(0, 4).map(m => `${m.milestone}: ${fd(m.before)} → ${fd(m.after)}`), `Projected LD: ${pesoFull(r.projected_ld_before)} → ${pesoFull(r.projected_ld_after)}`, r.finishes_after_contract_expiry ? `Finishes after contract expiry (${fd(r.contract_expiry)})` : 'Still within the contract period'])}\nConfidence: Medium — based on the current dependency chain and today's % complete.`; } catch (e) { return e.message; }
  }

    const done = p.activities.filter(a => a.aFinish && a.aFinish >= mStart); const prog = p.activities.filter(a => a.aStart && a.pct < 100);
    const h = health(p); const nx = p.activities.filter(a => a.pct < 100 && a.fStart <= addDays(mStart, 62)).slice(0, 3);

    const next = `Next period focus: ${nx.map(a => a.aStart ? `complete ${a.name} (forecast ${fds(a.fFinish)})` : `${a.name} (${fds(a.fStart)}–${fds(a.fFinish)})`).join('; ')}.`;
    const iss = p.issues.filter(i => i.status !== 'Resolved').map(i => `${i.title} (${i.pri}, target ${fd(i.target)})`).join('; ') || 'No open issues.';
    if (canEdit(p)) makeProposal({ type: 'psr_narrative', project_code: p.code, accomplishments: acc, next_period: next, issues: `Open issues: ${iss}. ${h.reasons.join('. ')}.` });
    return `Here's a draft narrative for the ${periodLabel(cp)} PSR of **${p.name}**, built from the schedule, issues and health data.${canEdit(p) ? ' Review it below and click Apply to put it in the draft PSR.' : ''}\n\n**Accomplishments:** ${acc}\n\n**Next period:** ${next}`;
  }

    const h = health(p); const beh = p.activities.filter(a => actState(a).k === 'behind' && !a.ms).slice(0, 3);

  }
  if (/my task|work on|assigned|first/.test(s)) {

  }
  if (/attention|today|priorit|focus|portfolio|overview/.test(s) || true) {
    const n = notifications().filter(x => x.r === 'R' || x.r === 'A').slice(0, 5);
    const att = myProjects().map(x => ({ x, h: health(x) })).filter(o => o.h.attention);

  }
}

function md(t) {
  const lines = esc(t).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/`([^`]+)`/g, '<code>$1</code>').split('\n');
  let out = '', inList = false;
  for (const l of lines) {
    const m = l.match(/^\s*(?:[-*•]|\d+\.)\s+(.*)$/);
    if (m) { if (!inList) { out += '<ul>'; inList = true; } out += `<li>${m[1]}</li>`; continue; }
    if (inList) { out += '</ul>'; inList = false; }
    const hd = l.match(/^#{1,4}\s+(.*)$/); if (hd) { out += `<p><b>${hd[1]}</b></p>`; continue; }
    if (l.trim()) out += `<p>${l}</p>`;
  }
  if (inList) out += '</ul>'; return out;
}

  finally { if (ui.me === actor) { T.busy = false; renderTala(); avaRefreshReadiness(); } }
}
function avaConnectionCard() {
  return `<div class="card"><h3>Project agents</h3><p class="muted">Connect each assistant to its published agent. These settings apply to this browser; shared deployment can configure the same connections for everyone.</p>
    <div class="agent-connections">${[['ari', 'Ari', 'Reporting readiness'], ['ava', 'AVA', 'PSR narrative drafting'], ['theo', 'Theo', 'Approval evidence briefing']].map(([key, name, purpose]) => `<form data-ava-connect data-agent="${key}" class="card"><h4 class="agent-heading">${agentAVAtar(key)}${name} · ${purpose}</h4><label class="field">Published Agent ID<input name="agentId" aria-label="${name} published Agent ID" placeholder="Ag…" value="${esc((window.__ITPH_AGENTS?.[key] || (key === 'ava' ? window.__ITPH_AVA : null))?.getId() || '')}" required pattern="Ag[A-Za-z0-9_]+"></label><button class="btn pri">${agentAVAtar(key)}Save and check ${name}</button><p class="muted" role="status"></p></form>`).join('')}</div></div>`;
}
function suggestions() {
  const p = contextProject();
  if (curTier() === 'basic') return ['How do I update my progress?', 'How do I submit a PSR?', 'What is assigned to me?', 'Open the schedule'];
  const out = p ? ['Review this project before status reporting', 'Find missing updates in this project'] : ['Brief me on portfolio health', 'Which projects need attention?'];
  if (p && canEdit(p)) out.push('Draft this month’s PSR narrative');
  out.push('What should I address first?');
  return out;
}
async function initTala() {
  T.tier = advAllowed() ? 'advanced' : 'basic';
  try { const tier = localStorage.getItem(PREF + '-leaf-tier'); if (tier) T.tier = tier; } catch (e) {}
  T.mode = 'basic'; T.sample = null;
  if (window.__ITPH_AVA?.getId()) {
    T.mode = 'checking'; renderTala();
    try { await window.__ITPH_AVA.connect(); T.mode = 'kissflow'; }
    catch (e) { T.mode = 'basic'; T.connectionError = e.message; }
  }
  renderTala();
}
document.addEventListener('click', e => {
  const readiness = e.target.closest('[data-ava-readiness]');
  if (readiness) { e.preventDefault(); e.stopPropagation(); avaStartReadiness(readiness.dataset.p, readiness.dataset.report); return; }
  const src = e.target.closest('[data-ava-source]');
  if (src) { const p = myProjects().find(p => p.id === src.dataset.p); if (p) { T.open = false; leafNavigate({ view: 'projects', tab: src.dataset.tab }, p.code); renderTala(); } return; }
  const check = e.target.closest('[data-ava-check]'); if (check) avaCheckRun(T.msgs[+check.dataset.avaCheck]);
}, true);
document.addEventListener('submit', async e => {
  if (!e.target.matches('[data-ava-connect]')) return;
  e.preventDefault(); e.stopPropagation(); if (role() !== 'APPADMIN' || T.busy || T.theo?.pending) return;
  const form = e.target, status = form.querySelector('[role="status"]');
  const agent = form.dataset.agent || 'ava';
  const api = window.__ITPH_AGENTS?.[agent] || (agent === 'ava' ? window.__ITPH_AVA : null);
  if (!api) { status.textContent = 'Open this app inside Kissflow to configure agents.'; return; }
  const id = String(new FormData(form).get('agentId') || '').trim();
  if (!/^Ag[A-Za-z0-9_]+$/.test(id)) { status.textContent = 'Enter the published Kissflow Agent ID.'; return; }
  status.textContent = 'Checking published agent…';
  try { await api.configure(id); T.psrReadiness = null; T.theo = null; T.theo = null; status.textContent = `${agent.toUpperCase()} is connected to the published Kissflow agent.`; if (agent === 'ava') { T.mode = 'kissflow'; T.connectionError = ''; } }
  catch (e) { status.textContent = e.message || 'Could not connect to AVA.'; T.mode = 'basic'; T.connectionError = status.textContent; }
  renderTala();
}, true);

/* Agent identity and read-only approval assistance. */
function agentAVAtar(name, cls = 'ava-button-avatar') {
  if (name !== 'ari' && name !== 'theo') return aiAv(cls);
  const file = name === 'ari' ? 'ari-robots.png' : 'theo-robots.png';
  return `<span class="${esc(cls)} agent-avatar agent-${name}" role="img" aria-label="${name === 'ari' ? 'Ari' : 'Theo'} robot"><img src="./${file}" alt="" aria-hidden="true"></span>`;
}
function theoActor() {
  return { userId: ui.me, role: role(), advanced: curTier() === 'advanced' };
}
function theoAllowed(p, r) {
  return !!(myProjects().some(x => x.id === p?.id) && window.__ITPH_AGENT_RULES?.canBriefApproval(p, r, theoActor()));
}
function theoStamp(p, r) {
  return JSON.stringify([avaScopeStamp(), avaFingerprint(p), r, p.dh, p.ps, p.psRequired, TODAY, window.__ITPH_AGENTS?.theo?.getId()]);
}
function theoFresh(p, r) {
  const state = T.theo;
  return !!(state && theoAllowed(p, r) && state.projectId === p.id && state.reportId === r.id && state.stamp === theoStamp(p, r));
}
function theoCard(p, r) {
  if (!theoAllowed(p, r)) return '';
  const state = theoFresh(p, r) ? T.theo : null;
  const connected = !!window.__ITPH_AGENTS?.theo?.getId();
  return `<section class="card ava-readiness" data-theo-slot data-p="${esc(p.id)}" data-report="${esc(r.id)}" aria-label="Theo approval briefing">
    <div class="row" style="justify-content:space-between"><h3 class="agent-heading">${agentAVAtar('theo')}Theo · Approval briefing</h3><span class="tag">${connected ? 'AI briefing' : 'Built-in briefing'}</span></div>
    <p class="muted">Review saved report evidence, return comments and Sponsor routing. Current project checks are shown separately. You decide Approve or Return to PM.</p>
    <div class="row"><button class="btn ai" data-theo-start data-p="${esc(p.id)}" data-report="${esc(r.id)}" ${T.busy || T.unknownOutcome || T.theo?.pending ? 'disabled' : ''}>${agentAVAtar('theo')}${state?.thinking ? 'Preparing brief…' : state?.text ? 'Brief again with Theo' : 'Brief with Theo'}</button>
    ${state?.pending && state.executionId ? `<button class="btn sm" data-theo-check ${T.busy ? 'disabled' : ''}>${agentAVAtar('theo')}Check this execution</button>` : ''}
    ${state?.thinking ? '<button class="btn sm" data-t="stop">Stop waiting</button>' : ''}</div>
    ${!connected ? '<p class="note">Theo is not connected. This is a built-in evidence briefing, not an AI response.</p>' : ''}
    ${T.unknownOutcome ? '<p class="note">A request may still be running. Check its status in Kissflow before starting another conversation.</p>' : ''}
    ${T.theo && !state ? '<p class="note">Report evidence or access changed. Run a fresh briefing.</p>' : ''}
    ${state ? `<div class="ava-readiness-answer" role="status">${state.builtIn ? `<p style="white-space:pre-wrap">${esc(state.text || '')}</p>` : md(state.text || '')}</div>${state.note ? `<p class="note">${esc(state.note)}</p>` : ''}${state.executionId ? `<p class="note">Execution: ${esc(state.executionId)}</p>` : ''}
    ${!state.thinking && state.current ? '<h4>Current project checks · separate from saved PSR</h4>' + avaSourceCard(state.current, state.current.findings.length) : ''}` : ''}
  </section>`;
}
function theoRefresh() {
  const slot = document.querySelector('[data-theo-slot]'); if (!slot) return;
  const p = myProjects().find(x => x.id === slot.dataset.p);
  const r = p?.psrs.find(x => x.id === slot.dataset.report);
  slot.outerHTML = p && r ? theoCard(p, r) : '';
}
async function theoStart(projectId, reportId) {
  const p = myProjects().find(x => x.id === projectId), r = p?.psrs.find(x => x.id === reportId);
  if (!theoAllowed(p, r) || T.busy || T.unknownOutcome || T.theo?.pending) return;
  const api = window.__ITPH_AGENTS?.theo;
  const ctl = new AbortController(); const actor = ui.me;
  const state = { projectId, reportId, stamp: theoStamp(p, r), thinking: true, current: avaReview(p), text: '' };
  T.theo = state; T.busy = true; T.ctl = ctl;
  const active = () => T.theo === state && ui.me === actor && theoAllowed(p, r) && state.stamp === theoStamp(p, r);
  theoRefresh();
  try {
    const context = window.__ITPH_AGENT_RULES.approvalContext(p, r, theoActor(), { today: TODAY, current: state.current });
    if (!api?.getId()) { state.builtIn = true; state.text = window.__ITPH_AGENT_RULES.approvalBrief(context); }
    else {
      const serialized = JSON.stringify(context);
      if (serialized.length > 100000) throw new Error('This report has too much evidence for one briefing. Review the report directly.');
      const result = await api.run({ request: 'Brief the assigned approver on this PSR using its saved snapshot, narrative, comments and routing. Separate current project findings. Do not draft, apply, submit or approve anything.', context: serialized }, { signal: ctl.signal, onAccepted: id => { state.executionId = id; state.pending = true; if (active()) theoRefresh(); } });
      if (active()) { state.text = result.items[0].answer; state.executionId = result.executionId; }
      state.pending = false;
    }
  } catch (e) {
    if (e.executionId) state.executionId = e.executionId;
    state.pending = !!state.executionId && !['AVA_INVALID_OUTPUT'].includes(e.code);
    if (active()) state.text = e.message || 'Theo could not complete this briefing.';
    if (e.code === 'AGENT_EXECUTE_OUTCOME_UNKNOWN' && T.theo === state) { T.unknownOutcome = true; state.note = 'The request may have started. It has not been retried.'; }
    else if (state.pending) state.note = 'Check this execution to read the same run without starting another.';
  } finally {
    state.thinking = false;
    if (!active()) { state.text = ''; state.current = null; }
    if (T.ctl === ctl) { T.busy = false; T.ctl = null; renderTala(); theoRefresh(); }
  }
}
async function theoCheck() {
  const state = T.theo;
  const p = myProjects().find(x => x.id === state?.projectId), r = p?.psrs.find(x => x.id === state?.reportId);
  if (!state?.executionId || T.busy || !theoFresh(p, r)) return;
  T.busy = true; theoRefresh();
  try {
    const execution = await window.__ITPH_AGENTS.theo.read(state.executionId);
    if (T.theo !== state || !theoFresh(p, r)) return;
    if (execution.Status === 'Failed') state.pending = false;
    const result = window.__ITPH_AVA_RULES.executionResult(execution);
    if (result) { state.text = result.items[0].answer; state.pending = false; state.note = ''; }
    else state.note = `Execution status: ${execution.Status || 'In progress'}. Check again later.`;
  } catch (e) { if (T.theo === state && theoFresh(p, r)) { state.note = e.message; if (e.code === 'AVA_INVALID_OUTPUT') state.pending = false; } }
  finally { T.busy = false; theoRefresh(); renderTala(); }
}
document.addEventListener('click', e => {
  const start = e.target.closest('[data-theo-start]');
  if (start) { e.preventDefault(); e.stopPropagation(); theoStart(start.dataset.p, start.dataset.report); return; }
  if (e.target.closest('[data-theo-check]')) { e.preventDefault(); e.stopPropagation(); theoCheck(); }
}, true);

AI_IMG = './ava-avatar.webp'; AI_HERO = './ava.webp'; AI_TAG = 'your AI virtual assistant for projects, schedules and status reports';
window.__ITPH_READY.then(() => { load(); ui.logo = '/bpi-logo.webp'; try { const l = localStorage.getItem(PREF + '-logo'); if (l) ui.logo = l; } catch (e) {} try { ui.theme = localStorage.getItem(PREF + '-theme') === 'dark' ? 'dark' : 'light'; } catch (e) { ui.theme = 'light'; } applyTheme(); S.projects.forEach(schedule); window.__ITPH = { health, fin, render, makePSR }; S.projects.forEach(p => (p.psrs || []).forEach(r => { if (!r.snap) { try { r.snap = makePSR(p, r.period, true).snap; } catch (e) { console.error('psr snapshot', e); } } })); window.__ITPH_BASELINE && window.__ITPH_BASELINE(S); window.__ITPH_RENDER = render; render(); initTala(); });
})();
